name: ci

# workflow_dispatch is the manual escape hatch: without it, a push whose commits
# carry a skip-ci marker leaves code unvalidated with no way to launch a run short
# of pushing another commit.
#
# CI is not the only gate: the plugin is mounted on the local m501/m502 stacks
# (moodle-dev/plugins.conf), so run `mdl ci moodle-local_unifiedgrader` before pushing.
on:
  push:
  pull_request:
  workflow_dispatch:

# Behat excludes @local_unifiedgrader_wip. Those scenarios are placeholders the
# author tagged as unfinished — they call six step definitions that were never
# written. They were invisible until 2026-08-11 because a MOODLE_INTERNAL guard
# in the context file killed the whole Behat process before any of them ran.

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php
  # $plugin->supported) — update these when the supported range changes.
  # The highest branch runs the full PHP x DB matrix; older branches run
  # PostgreSQL only. PHPUnit and Behat run on every runtime leg.
  #
  # Replaces a hand-rolled matrix that ran the same gate commands inline. The
  # reusable workflow is the fleet standard: one definition maintained upstream,
  # so a change to how a gate is invoked does not have to be repeated per repo.
  ci-502:
    name: Moodle 5.02
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_502_STABLE
      behat-tags: "@local_unifiedgrader&&~@local_unifiedgrader_wip"

  ci-501:
    name: Moodle 5.01
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_501_STABLE
      one-db-only: true
      behat-tags: "@local_unifiedgrader&&~@local_unifiedgrader_wip"

  ci-500:
    name: Moodle 5.00
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_500_STABLE
      one-db-only: true
      behat-tags: "@local_unifiedgrader&&~@local_unifiedgrader_wip"
